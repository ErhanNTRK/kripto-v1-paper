name: Kripto V1 Paper

on:
  # schedule disabled 21 Sep 2026: configured for every 15 minutes, but
  # GitHub's free-tier scheduler was live-observed to actually fire it
  # every 2-5 HOURS instead (a documented GitHub Actions limitation for
  # high-frequency cron, not fixable from this file). A candidate detected
  # that late is often already past signal_confirmation_expiry_minutes, or
  # still "fresh" by timestamp but at a price that has drifted past
  # max_entry_drift_fraction -- either way silently rejected, likely
  # explaining some of the "AL_ADAYI geldi, ALDIM gelmedi" history
  # independent of the separate Binance IP-ban issue. Candidate detection
  # now runs locally instead, in the same reliable process/loop as
  # entries/exits (see render_web.run_periodic_scans's `detect` param and
  # github_worker.local_tick) -- this workflow would only add hours-stale,
  # duplicate Telegram sends (its own separate telegram.sqlite never sees
  # the live process's dedupe) on top of that. workflow_dispatch is kept
  # as a manual backstop for whenever no live process is running at all.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kripto-v1-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore paper state
        shell: bash
        run: |
          mkdir -p runtime
          if git fetch origin runtime-state:refs/remotes/origin/runtime-state; then
            git archive origin/runtime-state | tar -x -C runtime
          fi
      - name: Run paper scan and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_STORAGE: runtime
          PAPER_RELAX_LIMITS: "1"
          PAPER_STATE_FILE: state-relaxed.json
        run: python -m crypto_v1.github_worker
      - name: Wake Frankfurt exit monitor
        # This ping is a best-effort nudge, not a pipeline gate -- a failed
        # or slow wake-up must never block publishing the freshly-scanned
        # candidate state below. A GitHub Actions step's default `if:
        # success()` means a failed step SKIPS every step after it; this
        # silently starved the runtime-state branch of new candidates for
        # ~10 minutes on 18 Sep 2026 when the Render service was crashing
        # on /scan (a since-fixed rate-limit bug), because "Save paper
        # state" below never ran at all that whole time.
        continue-on-error: true
        # /status and /health are printed purely for the log: the tick
        # result alone cannot say whether "cooling_down" is a fresh ban or
        # an old build still running, whether real orders are even enabled,
        # or which commit Render is on. Neither costs any Binance weight.
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 120 https://kripto-v1-frankfurt.onrender.com/scan
          echo
          echo "--- /status ---"
          curl --silent --show-error --max-time 30 https://kripto-v1-frankfurt.onrender.com/status || true
          echo
          echo "--- /health ---"
          curl --silent --show-error --max-time 30 https://kripto-v1-frankfurt.onrender.com/health || true
          echo
      - name: Save paper state
        shell: bash
        run: |
          state_dir="$(mktemp -d)"
          cp -a runtime/. "$state_dir/"
          cd "$state_dir"
          git init -b runtime-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update paper state"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" runtime-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
