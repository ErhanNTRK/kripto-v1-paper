name: Kripto V2 One Year Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download one year of public top-20 data
        run: python -m crypto_v1 --config config_v2.json fetch --days 365 --data data-v2
      - name: Run pre-registered V2 research
        run: python -m crypto_v1 --config config_v2.json research-v2 --data data-v2 --output reports/research-v2
      - name: Walk-forward validate V2 (5 independent windows + stress)
        run: python -m crypto_v1 --config config_v2.json walkforward-v2 --data data-v2 --output reports/walkforward-v2 --windows 5
      - name: Walk-forward validate V2 on 4-hour bars (lower frequency, less cost drag)
        run: python -m crypto_v1 --config config_v2.json walkforward-v2-timeframe --data data-v2 --output reports/walkforward-v2-4h --timeframe 4h --windows 5 --min-trades 8
      - name: Walk-forward validate V2 on daily bars (lowest frequency)
        run: python -m crypto_v1 --config config_v2.json walkforward-v2-timeframe --data data-v2 --output reports/walkforward-v2-1d --timeframe 1d --windows 3 --min-trades 5
      - name: Download one year of public top-30 data (wider universe test)
        run: python -m crypto_v1 --config config_v2_topn30.json fetch --days 365 --data data-v2-30
      - name: Walk-forward validate V2 top-30 on 4-hour bars (matches live)
        run: python -m crypto_v1 --config config_v2_topn30.json walkforward-v2-timeframe --data data-v2-30 --output reports/walkforward-v2-top30-4h --timeframe 4h --windows 5 --min-trades 8
      - uses: actions/upload-artifact@v4
        with:
          name: kripto-v2-one-year-report
          path: |
            reports/research-v2/report.json
            reports/walkforward-v2
            reports/walkforward-v2-4h
            reports/walkforward-v2-1d
            reports/walkforward-v2-top30-4h
          retention-days: 30
